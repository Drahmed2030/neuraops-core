name: Security lockfile refresh

on:
  push:
    branches:
      - security/nextjs-16.3.8

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-16.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh Next.js patch and lockfile
        run: npm install --package-lock-only --save-exact next@16.3.8
      - name: Verify patched version
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.8') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next'].version!=='16.3.8') process.exit(1)"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: update Next.js to 16.3.8"
          git push origin HEAD:security/nextjs-16.3.8
