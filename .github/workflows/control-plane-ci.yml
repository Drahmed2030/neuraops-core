name: Control Plane CI

on:
  push:
    branches:
      - platform/control-plane-v0.1
  pull_request:
    branches:
      - feature/nexus-pilot-composite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_PLANE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret
      CONTROL_PLANE_SUPABASE_URL: https://example.invalid
      CONTROL_PLANE_SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret
      NEXUS_AUDIT_POLICY_JSON: '{"version":"ci-v1","thresholds":{"medianReferralResponseHours":{"attention":12,"critical":24,"direction":"higher"},"unresolvedReferralBacklog":{"attention":20,"critical":40,"direction":"higher"},"followUpCompletionPercent":{"attention":80,"critical":60,"direction":"lower"},"leakagePercent":{"attention":10,"critical":20,"direction":"higher"}}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from pinned dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies strictly
        run: npm ci --no-audit --no-fund

      - name: Unit and domain tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

      - name: Persist verified lockfile on branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/platform/control-plane-v0.1'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync verified package lock"
          git push origin HEAD:platform/control-plane-v0.1
