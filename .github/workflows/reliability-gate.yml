name: Reliability gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [p7/security-modernization-node24-next16]

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reliability tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
          OPENAI_API_KEY: ci-placeholder-not-a-secret
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
